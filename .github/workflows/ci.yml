name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24'

jobs:
  docs:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, ADR index and secret leakage
        run: bash ./scripts/check-docs.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint and architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    name: Build and bundle budget
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      PLATFORM_HOST: admin.localhost
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A budget that is not enforced is a wish. If attendance does not load on
      # a teacher's phone at 08:30 over 3G, the product does not work (§4.4).
      - run: pnpm check:bundle

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sm_saas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The migrator is a superuser: migration 0001 creates the roles.
      DATABASE_URL_MIGRATOR: postgres://postgres:postgres@localhost:5432/sm_saas
      # The app connects as sm_app — NOT as a superuser. A superuser bypasses
      # row-level security entirely, so an isolation suite run as `postgres`
      # would pass while proving nothing.
      DATABASE_URL_APP: postgres://sm_app:devpassword@localhost:5432/sm_saas
      # The one role with BYPASSRLS. Login legitimately needs it: it resolves
      # WHICH tenants an account belongs to, so it cannot run inside a tenant
      # session (§8.4).
      DATABASE_URL_PLATFORM: postgres://sm_platform:devpassword@localhost:5432/sm_saas
      DEV_DB_PASSWORD: devpassword
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm db:migrate

      # The permission vocabulary and role templates are reference data derived
      # from src/shared/permissions.ts. role_permission has a foreign key to
      # permission(key), so without this step no permission can be granted at
      # all and every authorised endpoint answers 403.
      - name: Seed platform reference data
        run: pnpm seed

      # Roles are created by 0001 without passwords — a migration is checked
      # into Git and a credential must not be. Dev and CI set them here;
      # production uses scripts/provision-host.sh.
      - name: Give the least-privilege roles a password (dev/CI only)
        run: pnpm db:roles:dev

      # A separate step BEFORE the main suite, so a tenancy regression is the
      # first thing that fails and is unmistakable in the log rather than one
      # red dot among four hundred (§11.6).
      - name: Tenant isolation suite
        run: pnpm test:isolation

      - name: Unit tests
        run: pnpm test

      # Real module wiring against a real database. Separate from the unit
      # suite so `pnpm test` stays runnable from a fresh clone with no
      # PostgreSQL.
      - name: Integration tests
        run: pnpm test:integration

      # HTTP-level: a real production build, a real server, real cookies.
      # The only place the transport layer is actually exercised — envelope,
      # error→status mapping, HttpOnly cookie, rate limiter.
      - name: Build for HTTP tests
        run: pnpm build
        env:
          APP_URL: http://localhost:3123
          PLATFORM_HOST: admin.localhost

      - name: HTTP route tests
        run: pnpm test:http

      # A seed that is not idempotent breaks the second deploy, not the first.
      - name: Migrations are idempotent
        run: pnpm db:migrate
